<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaandam Jiujitsu - Aula Experimental</title>
    <style>
        body { font-family: sans-serif; background: #111; color: white; padding: 20px; display: flex; justify-content: center; }
        .card { background: #222; padding: 20px; border-radius: 10px; width: 100%; max-width: 400px; border: 1px solid #333; }
        h2 { color: #d4af37; text-align: center; }
        label { display: block; margin: 15px 0 5px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #444; background: #333; color: white; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: #d4af37; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>ZAANDAM JIUJITSU</h2>
        <p>Agende sua aula experimental:</p>
        
        <form id="formAgendamento">
            <label>Nome Completo</label>
            <input type="text" id="nome" required>

            <label>Faixa</label>
            <select id="faixa">
                <option value="Branca">Branca</option>
                <option value="Azul">Azul</option>
                <option value="Roxa">Roxa</option>
                <option value="Marrom">Marrom</option>
                <option value="Preta">Preta</option>
            </select>

            <label>Dia da Aula</label>
            <input type="date" id="dia" required>

            <button type="submit">Enviar para o WhatsApp</button>
        </form>
    </div>

    <script>
        document.getElementById('formAgendamento').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nome = document.getElementById('nome').value;
            const faixa = document.getElementById('faixa').value;
            const dia = document.getElementById('dia').value.split('-').reverse().join('/');
            
            const numeroAcademia = "5521998672999"; // Substitua pelo seu número
            const texto = `Olá! Meu nome é ${nome}. Gostaria de marcar uma aula experimental para o dia ${dia}. Minha faixa é ${faixa}.`;
            
            const url = `https://wa.me/${numeroAcademia}?text=${encodeURIComponent(texto)}`;
            
            window.location.href = url;
        });
    </script>
</body>
</html>
